<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 10s seamless story loop:
       0%–38%  Sleepy standby (closed eyes, dim halo, zzz drift)
       38%–45% Calm wake-up (halo brightens, smooth face crossfade)
       45%–92% Awake and streaming (signal waves + analog stick orbit)
       92%–100% Doze back off seamlessly to 0% */

    .ghost-float {
      animation: ghost-gentle-float 3.3333s ease-in-out infinite;
    }

    @keyframes ghost-gentle-float {
      0%,
      100% {
        transform: translateY(2.5px);
      }
      50% {
        transform: translateY(-3.5px);
      }
    }

    .ghost-shadow {
      animation: ghost-gentle-shadow 3.3333s ease-in-out infinite;
    }

    @keyframes ghost-gentle-shadow {
      0%,
      100% {
        transform: scale(1.04, 1.03);
        opacity: 0.85;
      }
      50% {
        transform: scale(0.8, 0.82);
        opacity: 0.46;
      }
    }

    .ghost-halo {
      animation: halo-glow 10s ease-in-out infinite;
    }

    @keyframes halo-glow {
      0%,
      38% {
        opacity: 0.22;
      }
      45%,
      92% {
        opacity: 1;
      }
      97%,
      100% {
        opacity: 0.22;
      }
    }

    .face-sleepy {
      animation: sleepy-visibility 10s ease-in-out infinite;
    }

    @keyframes sleepy-visibility {
      0%,
      38% {
        opacity: 1;
      }
      44%,
      92% {
        opacity: 0;
      }
      97%,
      100% {
        opacity: 1;
      }
    }

    .face-awake {
      animation: awake-visibility 10s ease-in-out infinite;
    }

    @keyframes awake-visibility {
      0%,
      39% {
        opacity: 0;
      }
      45%,
      92% {
        opacity: 1;
      }
      96%,
      100% {
        opacity: 0;
      }
    }

    .zzz-group {
      animation: zzz-envelope 10s ease-in-out infinite;
    }

    @keyframes zzz-envelope {
      0%,
      35% {
        opacity: 1;
      }
      40%,
      94% {
        opacity: 0;
      }
      98%,
      100% {
        opacity: 1;
      }
    }

    .zzz {
      fill: none;
      stroke: #56c2f0;
      stroke-width: 3.2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: zzz-drift 2.8s ease-out infinite;
    }

    .zzz-1 {
      animation-delay: 0s;
    }

    .zzz-2 {
      animation-delay: -1.4s;
    }

    @keyframes zzz-drift {
      0% {
        opacity: 0;
        transform: translate(0px, 4px) scale(0.62);
      }
      22% {
        opacity: 0.9;
      }
      72% {
        opacity: 0.55;
      }
      100% {
        opacity: 0;
        transform: translate(14px, -18px) scale(1.12);
      }
    }

    .wave-group {
      animation: wave-envelope 10s ease-in-out infinite;
    }

    @keyframes wave-envelope {
      0%,
      43% {
        opacity: 0;
      }
      47%,
      90% {
        opacity: 1;
      }
      94%,
      100% {
        opacity: 0;
      }
    }

    .wave {
      fill: none;
      stroke: #56c2f0;
      stroke-linecap: round;
      animation: signal-wave 2.4s linear infinite;
    }

    .wave-1 {
      animation-delay: 0s;
    }

    .wave-2 {
      animation-delay: -0.8s;
    }

    .wave-3 {
      animation-delay: -1.6s;
    }

    @keyframes signal-wave {
      0% {
        opacity: 0;
        transform: scale(0.6);
        stroke-width: 8.5px;
      }
      15% {
        opacity: 0.95;
      }
      50% {
        opacity: 0.85;
        stroke-width: 4.4px;
      }
      80% {
        opacity: 0.35;
      }
      100% {
        opacity: 0;
        transform: scale(2.15);
        stroke-width: 2.8px;
      }
    }

    .stick-cap {
      animation: stick-orbit 10s linear infinite;
    }

    @keyframes stick-orbit {
      0%,
      55% {
        transform: translate(0, 0);
        animation-timing-function: ease-out;
      }
      58% {
        transform: translate(3.2px, 0);
        animation-timing-function: linear;
      }
      60.5% {
        transform: translate(2.26px, 2.26px);
      }
      63% {
        transform: translate(0, 3.2px);
      }
      65.5% {
        transform: translate(-2.26px, 2.26px);
      }
      68% {
        transform: translate(-3.2px, 0);
      }
      70.5% {
        transform: translate(-2.26px, -2.26px);
      }
      73% {
        transform: translate(0, -3.2px);
      }
      75.5% {
        transform: translate(2.26px, -2.26px);
      }
      78% {
        transform: translate(3.2px, 0);
        animation-timing-function: ease-in-out;
      }
      82%,
      100% {
        transform: translate(0, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ghost-float,
      .ghost-shadow,
      .ghost-halo,
      .face-sleepy,
      .face-awake,
      .zzz-group,
      .zzz,
      .wave-group,
      .wave,
      .stick-cap {
        animation: none;
      }
      .ghost-halo {
        opacity: 1;
      }
      .face-sleepy,
      .zzz-group {
        opacity: 0;
      }
      .face-awake,
      .wave-group {
        opacity: 1;
      }
      .wave-1 {
        opacity: 1;
        transform: scale(1);
        stroke-width: 6px;
      }
      .wave-2 {
        opacity: 1;
        transform: scale(1.85);
        stroke-width: 3.25px;
      }
      .wave-3 {
        opacity: 0;
      }
    }
  </style>
  <defs>
    <radialGradient id="shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#033157" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#033157" stop-opacity="0.17" />
      <stop offset="100%" stop-color="#033157" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ghost-fill" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="68%" stop-color="#FCFBF7" />
      <stop offset="100%" stop-color="#EAF6FD" />
    </radialGradient>
    <filter id="ghost-halo-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blurWide" />
      <feFlood flood-color="#7DD3FC" flood-opacity="0.52" result="glowColor" />
      <feComposite in="glowColor" in2="blurWide" operator="in" />
    </filter>
    <filter id="ghost-depth-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blurDepth" />
      <feOffset in="blurDepth" dx="0" dy="1.5" result="offsetDepth" />
      <feFlood flood-color="#033157" flood-opacity="0.16" result="depthColor" />
      <feComposite in="depthColor" in2="offsetDepth" operator="in" result="softDepth" />
      <feMerge>
        <feMergeNode in="softDepth" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(96 183)">
    <g class="ghost-shadow">
      <ellipse cx="0" cy="0" rx="52" ry="6.5" fill="url(#shadow-grad)" />
    </g>
  </g>
  <g class="ghost-float">
    <!-- Sleepy zzz drift at top-right -->
    <g class="zzz-group">
      <g transform="translate(152 44)">
        <path class="zzz zzz-1" d="M-5.5 -5.5 H5.5 L-5.5 5.5 H5.5" />
        <path class="zzz zzz-2" d="M-5.5 -5.5 H5.5 L-5.5 5.5 H5.5" />
      </g>
    </g>
    <!-- Awake wireless signal waves at top-right -->
    <g class="wave-group">
      <g transform="translate(146 44)">
        <path class="wave wave-1" d="M0 -15.5319C8.308 -15.5319 15.164 -9.0925 15.271 0" />
        <path class="wave wave-2" d="M0 -15.5319C8.308 -15.5319 15.164 -9.0925 15.271 0" />
        <path class="wave wave-3" d="M0 -15.5319C8.308 -15.5319 15.164 -9.0925 15.271 0" />
      </g>
    </g>
    <!-- Animated outer sky-blue halo (dim while sleeping, bright when awake) -->
    <path
      class="ghost-halo"
      d="M96.6437 21.0062C62.8517 21.0062 34.4854 44.7057 28.3995 74.9323C27.3433 80.362 27 86.2117 27 91.8535V147.571C27 150.048 27.0792 152.21 27.3433 153.843C28.7164 163.489 37.3241 169.998 46.3559 169.998C54.0138 169.998 61.0899 165.227 64.0214 158.506C65.5002 155.266 68.3001 153.657 71.7845 153.657C75.1637 153.657 78.2004 155.502 79.4423 158.719C82.1366 165.466 89.1859 169.998 95.9464 169.998C103.154 169.998 110.02 165.149 112.504 158.719C113.824 155.424 116.834 153.606 120.03 153.606C123.541 153.606 126.235 155.24 127.661 158.404C130.776 165.202 138.091 170 145.326 170C154.911 170 163.361 162.752 164.657 153.054C164.921 151.157 165 149.154 165 147.178V90.9248C165 85.2316 164.472 79.5919 163.284 74.4525C156.391 44.7819 129.636 21 96.628 21L96.6437 21.0062Z"
      fill="#FFFFFF"
      filter="url(#ghost-halo-filter)"
    />
    <!-- Ghost-Pad body silhouette -->
    <path
      d="M96.6437 21.0062C62.8517 21.0062 34.4854 44.7057 28.3995 74.9323C27.3433 80.362 27 86.2117 27 91.8535V147.571C27 150.048 27.0792 152.21 27.3433 153.843C28.7164 163.489 37.3241 169.998 46.3559 169.998C54.0138 169.998 61.0899 165.227 64.0214 158.506C65.5002 155.266 68.3001 153.657 71.7845 153.657C75.1637 153.657 78.2004 155.502 79.4423 158.719C82.1366 165.466 89.1859 169.998 95.9464 169.998C103.154 169.998 110.02 165.149 112.504 158.719C113.824 155.424 116.834 153.606 120.03 153.606C123.541 153.606 126.235 155.24 127.661 158.404C130.776 165.202 138.091 170 145.326 170C154.911 170 163.361 162.752 164.657 153.054C164.921 151.157 165 149.154 165 147.178V90.9248C165 85.2316 164.472 79.5919 163.284 74.4525C156.391 44.7819 129.636 21 96.628 21L96.6437 21.0062Z"
      fill="url(#ghost-fill)"
      stroke="#033157"
      stroke-opacity="0.16"
      stroke-width="1.8"
      stroke-linejoin="round"
      filter="url(#ghost-depth-filter)"
    />
    <!-- Sleepy face group -->
    <g class="face-sleepy">
      <path
        d="M53.5 85.5C58 92.2 74.5 93.2 82 87"
        stroke="#033157"
        stroke-width="6.5"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M110 87C117.5 93.2 134 92.2 138.5 85.5"
        stroke="#033157"
        stroke-width="6.5"
        stroke-linecap="round"
        fill="none"
      />
      <g opacity="0.65">
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 55.7539 121.036)" fill="#BCB6D7" />
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 64.5845 121.036)" fill="#BCB6D7" />
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 73.4155 121.036)" fill="#BCB6D7" />
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 117.57 121.036)" fill="#BCB6D7" />
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 126.401 121.036)" fill="#BCB6D7" />
        <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 135.231 121.036)" fill="#BCB6D7" />
      </g>
      <path
        d="M89 107.5C91.5 106.2 100.5 106.2 103 107.5"
        stroke="#033157"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </g>
    <!-- Awake face group -->
    <g class="face-awake">
      <rect x="52.0244" y="81.5619" width="31.5388" height="10.5129" rx="5" fill="#033157" />
      <rect width="31.5388" height="10.5129" rx="5" transform="matrix(0 -1 -1 0 73.0503 102.167)" fill="#033157" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 55.7539 121.036)" fill="#BCB6D7" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 64.5845 121.036)" fill="#BCB6D7" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 73.4155 121.036)" fill="#BCB6D7" />
      <circle cx="124.564" cy="86.3979" r="15.7694" fill="#033157" />
      <circle class="stick-cap" cx="124.774" cy="86.6083" r="10.5129" fill="#AFDDF5" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 117.57 121.036)" fill="#BCB6D7" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 126.401 121.036)" fill="#BCB6D7" />
      <rect width="10.5608" height="4.30668" rx="2.15334" transform="matrix(0.5 -0.866025 -0.866025 -0.5 135.231 121.036)" fill="#BCB6D7" />
      <path d="M85 104C85 104 87.8243 110 96 110C104.176 110 107 104 107 104" stroke-width="9" stroke-linecap="round" stroke="#033157" />
    </g>
  </g>
</svg>
